name: Trusted Markdown qualification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      trusted_sha:
        description: Reviewed full agent-skills commit containing trusted policy and archives
        required: true
        type: string
      candidate_sha:
        description: Full candidate commit to inspect as data
        required: true
        type: string

permissions: {}

jobs:
  markdown:
    permissions:
      contents: read
    uses: Hadden-Industries/markdown-quality/.github/workflows/markdown-quality.yml@2e619b8cd1024e3bd37a1452af55a2cdb9cd7867
    with:
      trusted-repository: Hadden-Industries/agent-skills
      trusted-sha: ${{ inputs.trusted_sha || github.event.pull_request.base.sha || github.sha }}
      candidate-repository: Hadden-Industries/agent-skills
      candidate-sha: ${{ inputs.candidate_sha || github.event.pull_request.head.sha || github.sha }}
      profile: .markdown-quality-execution.json
      qualification-evidence: ${{ github.event_name == 'workflow_dispatch' }}
