name: Markdown quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  markdown:
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Select the assessed npm toolchain
        shell: pwsh
        run: |
          if ($IsWindows) {
            npm install --global npm@12.2.0 --prefix (Split-Path (node -p 'process.execPath'))
          } else {
            npm install --global npm@12.2.0
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((npm --version) -ne '12.2.0') { throw 'Unexpected npm version' }
      - name: Install locked root dependencies
        run: npm ci --include=dev --ignore-scripts
      - name: Check maintained Markdown
        run: npm run check:markdown
      - name: Verify installed consumer contracts
        run: npm run test:markdown
