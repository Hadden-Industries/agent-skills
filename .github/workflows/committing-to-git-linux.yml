name: Committing-to-git Linux verification
run-name: Committing-to-git Linux verification (${{ inputs.revision }})

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Repository commit, tag, or branch to verify
        required: true
        default: main
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VERIFICATION_REVISION: ${{ inputs.revision }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the requested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Select the assessed npm toolchain
        run: |
          npm install --global npm@12.2.0
          test "$(npm --version)" = "12.2.0"

      - name: Record the tested revision and environment
        run: |
          VERIFICATION_OUTPUT="$RUNNER_TEMP/committing-to-git-linux"
          echo "VERIFICATION_OUTPUT=$VERIFICATION_OUTPUT" >> "$GITHUB_ENV"
          mkdir -p "$VERIFICATION_OUTPUT"
          node scripts/ci/verificationEvidence.js capture --verification-kind committing-to-git --output-root "$VERIFICATION_OUTPUT" --stage environment -- bash -e -o pipefail -c '
            git rev-parse HEAD
            cat /etc/os-release
            uname -a
            node --version
            npm --version
            git --version
            ssh -V
            command -v ssh-keygen
          '

      - name: Install locked dependencies
        run: node scripts/ci/verificationEvidence.js capture --verification-kind committing-to-git --output-root "$VERIFICATION_OUTPUT" --stage install -- npm ci

      - name: Check formatting, lint, and generated artifacts
        run: node scripts/ci/verificationEvidence.js capture --verification-kind committing-to-git --output-root "$VERIFICATION_OUTPUT" --stage build-check -- npm run build:check

      - name: Run committing-to-git and native adapter tests on Linux
        run: |
          node scripts/ci/verificationEvidence.js capture --verification-kind committing-to-git --output-root "$VERIFICATION_OUTPUT" --stage tests -- node --test --test-reporter=tap \
            'tests/committing-to-git/**/*.test.mjs' \
            tests/scripts/evaluation-path-metadata.test.mjs \
            tests/scripts/evaluation-homes.test.mjs

      - name: Report verification diagnostics
        if: ${{ !cancelled() }}
        run: node scripts/ci/verificationEvidence.js report --verification-kind committing-to-git --output-root "$RUNNER_TEMP/committing-to-git-linux"
